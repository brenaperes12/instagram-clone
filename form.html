<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <div id="conteudo">
        <div id="navbar">
            <img src="icons8-reproduzir-youtube-30.png" height="40" alt="logo">
            <div id="links">
                <a href="http://google.com" target="_blank">Visite o Google!</a>
                <a href="http://github.com" target="_blank">GitHub</a>
            </div>
        </div>
        <div id="sidebar">
            <form action="#" method="post">
                <div class="form-item">
                    <label for="texto-da-foto">Texto da foto</label>
                    <input type="text" name="texto-da-foto" id="nome">
                </div>
                <div clas="form-item">
                    <label for="seletor">Marque se for verdadeiro</label>
                    <input type="checkbox" name="seletor" id="checkbox1">
                </div>
                <div class="form-item">
                    <label for="idade">Selecione sua idade:</label>
                    <input type="radio" name="idade" id="idade1"> Menor de 18
                    <input type="radio" name="idade" id="idade2"> Entre 18 e 25
                    <input type="radio" name="idade" id="idade3"> Entre 25 e 40
                    <input type="radio" name="idade" id="idade4"> Acima de 40
                </div>  
                
                <textarea name="descrição" id="desc"></textarea>
                <input type="submit" value="Enviar">
            </form>

        </div>

    </div>
</body>
</html>
